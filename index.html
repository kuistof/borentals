<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BO.RENTALS — Coming Soon</title>
    <meta name="description" content="BO.RENTALS — Digital. Persönlich. Ohne Bullshit.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coral: #E8706A;
            --coral-hover: #d4574f;
            --black: #000000;
            --white: #ffffff;
            --gray: #888888;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--black);
            color: var(--white);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── MAIN ─── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        .hero {
            text-align: center;
            max-width: 800px;
        }

        /* ─── COMING SOON PILL ─── */
        .pill {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--coral);
            border: 1.5px solid rgba(232,112,106,0.4);
            padding: 12px 32px;
            border-radius: 100px;
            margin-bottom: 56px;
        }

        /* ─── HEADLINE ─── */
        h1 {
            font-size: clamp(48px, 8vw, 96px);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -3px;
            margin-bottom: 36px;
        }

        h1 span {
            color: var(--coral);
        }

        /* ─── SUBTITLE ─── */
        .subtitle {
            font-size: 18px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        /* ─── FORM CONTAINER (fixed height to prevent layout shift) ─── */
        .form-container {
            position: relative;
            height: 80px;
            max-width: 500px;
            margin: 0 auto;
        }

        .form-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            transition: opacity 0.3s ease;
        }

        .form-content.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ─── EMAIL ROW ─── */
        .email-row {
            display: flex;
            border-radius: 6px;
            overflow: hidden;
        }

        .email-input {
            flex: 1;
            padding: 18px 22px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px; /* ≥16px prevents iOS zoom */
            font-weight: 400;
            color: var(--white);
            background: #222222;
            border: none;
            outline: none;
            min-width: 0;
            -webkit-appearance: none;
            border-radius: 0;
        }

        .email-input::placeholder {
            color: #666;
        }

        .email-input:-webkit-autofill,
        .email-input:-webkit-autofill:hover,
        .email-input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--white);
            -webkit-box-shadow: 0 0 0 1000px #222222 inset;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
        }

        .submit-btn {
            padding: 18px 32px;
            background: var(--coral);
            color: var(--white);
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s ease;
            -webkit-appearance: none;
        }

        .submit-btn:hover {
            background: var(--coral-hover);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ─── SUCCESS MESSAGE ─── */
        .success-msg {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 56px;
            font-size: 16px;
            font-weight: 500;
            color: #6ecf8e;
        }

        /* ─── ERROR ─── */
        .error-msg {
            margin-top: 10px;
            font-size: 14px;
            color: var(--coral);
            min-height: 20px;
        }

        /* ─── FOOTER ─── */
        footer {
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-copy {
            font-size: 13px;
            color: var(--gray);
            font-weight: 400;
        }

        .footer-links {
            display: flex;
            gap: 28px;
        }

        .footer-links a {
            font-size: 13px;
            color: var(--gray);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--white);
        }

        /* ─── MOBILE ─── */
        @media (max-width: 600px) {
            body {
                overflow: hidden;
                height: 100vh;
            }

            main {
                padding: 40px 20px;
            }

            .pill {
                font-size: 11px;
                padding: 10px 24px;
                margin-bottom: 40px;
            }

            h1 {
                letter-spacing: -2px;
                margin-bottom: 28px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 32px;
            }

            .form-container {
                height: 110px;
            }

            .email-row {
                flex-direction: column;
            }

            .submit-btn {
                border-radius: 0 0 6px 6px;
            }

            footer {
                flex-direction: column;
                gap: 12px;
                padding: 20px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <main>
        <div class="hero">
            <div class="pill">Coming Soon</div>
            <h1>Let's f*cking <span>Bo.</span></h1>
            <p class="subtitle">
                Digital. Persönlich. Ohne Bullshit.<br>
                Eintragen und als Erstes erfahren, wann's losgeht:
            </p>

            <div class="form-container">
                <!-- Input state -->
                <div class="form-content" id="formInput">
                    <div class="email-row">
                        <input
                            type="email"
                            id="emailInput"
                            name="email"
                            class="email-input"
                            placeholder="deine@mail.com"
                            autocomplete="email"
                            required
                        >
                        <button type="button" class="submit-btn" id="submitBtn" onclick="submitEmail()">
                            Update
                        </button>
                    </div>
                    <div class="error-msg" id="errorMsg"></div>
                </div>

                <!-- Success state (same position, no layout shift) -->
                <div class="form-content hidden" id="formSuccess">
                    <div class="success-msg">Du bist auf der Liste. Wir melden uns! ✓</div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <span class="footer-copy">&copy; 2026 Rent Xperience GmbH</span>
        <div class="footer-links">
            <a href="#">Impressum</a>
            <a href="#">Cookies</a>
        </div>
    </footer>

    <script>
        /*
         *  GOOGLE APPS SCRIPT BACKEND
         *  ──────────────────────────
         *  1. Erstelle ein Google Sheet
         *  2. Öffne script.google.com → neues Projekt
         *  3. Füge diesen Code ein:
         *
         *     function doGet(e) {
         *       var sheet = SpreadsheetApp.openById('DEINE_SHEET_ID').getActiveSheet();
         *       var email = e.parameter.email;
         *       sheet.appendRow([new Date(), email]);
         *       return ContentService.createTextOutput('ok').setMimeType(ContentService.MimeType.TEXT);
         *     }
         *
         *  4. Die Sheet-ID ist der lange String zwischen /d/ und /edit in der Sheet-URL
         *  5. Bereitstellen → Neue Bereitstellung → Web-App
         *     → Zugriffsberechtigte: Jeder → Bereitstellen
         *  6. Die URL mit /exec am Ende unten einfügen
         */

        // ✏️ DEINE APPS SCRIPT URL HIER EINFÜGEN:
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwdHBaH2Ss0QlyI_x1Rvop_5lGKq5MJ-EQdEn4nFCpX4WiQK2wNRNoXm_cKZi-5VFtg/exec';

        function submitEmail() {
            var input = document.getElementById('emailInput');
            var btn = document.getElementById('submitBtn');
            var errorMsg = document.getElementById('errorMsg');
            var formInput = document.getElementById('formInput');
            var formSuccess = document.getElementById('formSuccess');
            var email = input.value.trim();

            // Validate
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorMsg.textContent = 'Bitte gib eine gültige E-Mail-Adresse ein.';
                return;
            }

            errorMsg.textContent = '';
            btn.disabled = true;
            btn.textContent = '...';

            // Submit via hidden iframe (CORS-safe with Apps Script)
            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = APPS_SCRIPT_URL + '?email=' + encodeURIComponent(email);
            document.body.appendChild(iframe);

            // Show success after brief delay (iframe doesn't give us a callback)
            setTimeout(function() {
                formInput.classList.add('hidden');
                formSuccess.classList.remove('hidden');
                input.value = '';
                btn.disabled = false;
                btn.textContent = 'Update';

                // Clean up iframe
                setTimeout(function() {
                    document.body.removeChild(iframe);
                }, 5000);
            }, 1200);
        }

        // Enter key support
        document.getElementById('emailInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitEmail();
            }
        });
    </script>

</body>
</html>
