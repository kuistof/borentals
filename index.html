<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>BO.RENTALS — Coming Soon</title>

    <meta name="description" content="BO.RENTALS Autos mieten - Digital. Persönlich. Ohne Bullshit.">
    <meta name="theme-color" content="#000000">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">

    <style>

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --coral: #E8706A;
            --coral-hover: #d4574f;
            --black: #000000;
            --white: #ffffff;
            --gray: #888888;
            --input: #222222;
            --border: rgba(255,255,255,0.08);
        }

        html {
            height: 100%;
        }

        body {
         font-family: 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        .hero {
            text-align: center;
            max-width: 820px;
            width: 100%;
        }

        .pill {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--coral);
            border: 1.5px solid rgba(232,112,106,0.35);
            padding: 12px 32px;
            border-radius: 999px;
            margin-bottom: 56px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 96px);
            font-weight: 900;
            line-height: 1.02;
            letter-spacing: -3px;
            margin-bottom: 32px;
        }

        h1 span {
            color: var(--coral);
        }

        .subtitle {
            font-size: 18px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
            line-height: 1.7;
            margin-bottom: 42px;
        }

        .form-container {
            position: relative;
            max-width: 540px;
            margin: 0 auto;
            width: 100%;
        }

        .form-content.hidden {
            display: none;
        }

        .email-row {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--input);
        }

        .email-input {
            flex: 1;
            padding: 18px 22px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            color: var(--white);
            background: transparent;
            border: none;
            outline: none;
            min-width: 0;
        }

        .email-input::placeholder {
            color: #666666;
        }

        .submit-btn {
            padding: 18px 32px;
            background: var(--coral);
            color: var(--white);
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s ease, opacity 0.2s ease;
        }

        .submit-btn:hover {
            background: var(--coral-hover);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .consent-row {
            margin-top: 18px;
            text-align: left;
        }

        .consent-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 13px;
            line-height: 1.5;
            color: rgba(255,255,255,0.72);
            cursor: pointer;
        }

        .consent-label input {
            margin-top: 2px;
            accent-color: var(--coral);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .microcopy {
            margin-top: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.45);
            text-align: left;
        }

        .success-msg {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            font-size: 18px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #111111;
            padding: 18px;
        }

        .error-msg {
            margin-top: 12px;
            font-size: 14px;
            color: var(--coral);
            min-height: 20px;
            text-align: left;
        }

        footer {
            padding: 28px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .footer-copy {
            font-size: 13px;
            color: var(--gray);
            line-height: 1.7;
        }

        @media (max-width: 600px) {

            main {
                padding: 40px 20px;
            }

            .pill {
                font-size: 11px;
                padding: 10px 24px;
                margin-bottom: 40px;
            }

            h1 {
                letter-spacing: -2px;
                margin-bottom: 28px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 32px;
            }

            .email-row {
                flex-direction: column;
            }

            .submit-btn {
                width: 100%;
            }

            .consent-label {
                font-size: 12px;
            }

            .microcopy {
                font-size: 11px;
            }
        }

    </style>
</head>

<body>

    <main>

        <div class="hero">

            <div class="pill">Coming Soon</div>

            <h1>
                Let's f*cking <span>Bo.</span>
            </h1>

            <p class="subtitle">
                Autos mieten – Digital. Persönlich. Ohne Bullshit.<br>
                Eintragen und als Erstes erfahren, wann's losgeht.
            </p>

            <div class="form-container">

                <div class="form-content" id="formInput">

                    <div class="email-row">

                        <input
                            type="email"
                            id="emailInput"
                            name="email"
                            class="email-input"
                            placeholder="deine@mail.com"
                            autocomplete="email"
                            required
                        >

                        <button
                            type="button"
                            class="submit-btn"
                            id="submitBtn"
                            onclick="submitEmail()"
                        >
                            bin dabei!
                        </button>

                    </div>

                    <input
                        type="text"
                        id="website"
                        name="website"
                        autocomplete="off"
                        tabindex="-1"
                        style="position:absolute;left:-9999px;opacity:0;height:0;width:0;"
                    >

                    <div class="consent-row">

                        <label class="consent-label">

                            <input type="checkbox" id="consentCheckbox">

                            <span>
                                Ich stimme zu, per E-Mail über den Launch sowie Marketing- und Angebotsaktionen von BO.RENTALS informiert zu werden.
                            </span>

                        </label>

                    </div>

                    <div class="microcopy">
                        Kein Spam. Jederzeit abmeldbar.
                    </div>

                    <div class="error-msg" id="errorMsg"></div>

                </div>

                <div class="form-content hidden" id="formSuccess">

                    <div class="success-msg">
                        Bis bald! 🐻
                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer>

        <span class="footer-copy">
            © 2026 Rent Xperience GmbH
        </span>

    </footer>

    <script>

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsx1xpIyXoOkg9jYA3gTWF4PzowURFhPmEFglTX1hDpmLWN1kY2j1e_Tp4bIPgqLsK/exec';

        async function submitEmail() {

            const input = document.getElementById('emailInput');
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            const formInput = document.getElementById('formInput');
            const formSuccess = document.getElementById('formSuccess');
            const consent = document.getElementById('consentCheckbox');
            const honeypot = document.getElementById('website');

            const email = input.value.trim();

            if (honeypot.value !== '') {
                return;
            }

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorMsg.textContent = 'Bitte gib eine gültige E-Mail-Adresse ein.';
                return;
            }

            if (!consent.checked) {
                errorMsg.textContent = 'Bitte bestätige die Datenschutzhinweise.';
                return;
            }

            errorMsg.textContent = '';

            btn.disabled = true;
            btn.textContent = 'lädt...';

            try {

                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        email: email,
                        consent: true,
                        source: 'bo.rentals-coming-soon'
                    })
                });

                formInput.classList.add('hidden');
                formSuccess.classList.remove('hidden');

                input.value = '';
                consent.checked = false;

            } catch (error) {

                console.error(error);

                errorMsg.textContent =
                    'Etwas ist schiefgelaufen. Bitte versuche es erneut.';

                btn.disabled = false;
                btn.textContent = 'bin dabei!';
            }
        }

        document.getElementById('emailInput').addEventListener('keydown', function(e) {

            if (e.key === 'Enter') {
                e.preventDefault();
                submitEmail();
            }

        });

    </script>

</body>
</html>
